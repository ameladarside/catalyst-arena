<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalyst Overthrow — Подключение к арене</title>
<!-- CATALYST_GH_REDIRECT_V1 -->
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080b14;color:#e2e8f0;font-family:system-ui,Segoe UI,sans-serif;text-align:center;padding:20px}
.box{max-width:460px;background:#101728;border:1px solid #d97706;border-radius:16px;padding:28px;box-shadow:0 16px 48px rgba(0,0,0,.7)}
h1{margin:0 0 10px;font-size:22px;color:#fbbf24}
p{margin:8px 0;color:#94a3b8;line-height:1.5}
.st{margin:16px 0;padding:12px;border-radius:10px;background:#090d18;font-weight:700;color:#38bdf8}
button{background:#0284c7;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <h1>CATALYST OVERTHROW</h1>
  <div id="st" class="st">Ищем активный сервер хоста...</div>
  <p id="sub">Как только сервер будет запущен, страница автоматически откроет игру.</p>
  <button onclick="checkServer()">Проверить сейчас</button>
</div>
<script>
const OWNER = 'ameladarside', REPO = 'catalyst-arena', BRANCH = 'main';
async function readStatus() {
  try {
    const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/server.json?ref=' + BRANCH + '&t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      return JSON.parse(atob(j.content.replace(/\s/g, '')));
    }
  } catch {}
  try {
    const r2 = await fetch('./server.json?t=' + Date.now(), { cache: 'no-store' });
    if (r2.ok) return await r2.json();
  } catch {}
  return null;
}
async function checkServer() {
  const st = document.getElementById('st');
  const info = await readStatus();
  if (info && info.online && info.url && info.url.startsWith('https://')) {
    st.style.color = '#4ade80';
    st.textContent = 'Сервер найден! Проверяем готовность...';
    try {
      const h = await fetch(info.url + '/health', { cache: 'no-store' });
      if (h.ok) { location.replace(info.url + location.search); return; }
    } catch {}
    st.textContent = 'Туннель ещё прогревается, повтор через 4 сек...';
  } else {
    st.style.color = '#fbbf24';
    st.textContent = 'Сервер сейчас выключен (офлайн)';
  }
}
checkServer();
setInterval(checkServer, 5000);
</script>
</body>
</html>
